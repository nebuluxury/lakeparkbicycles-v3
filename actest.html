<!doctype html><html><head><meta charset="utf-8"><title>ac test</title></head><body>
<pre id="out" style="font:14px monospace;white-space:pre-wrap;padding:20px">loading...</pre>
<script>
async function go(){
  var out=document.getElementById('out'); out.textContent='';
  function log(m){out.textContent+=m+'\n';}
  try{
    const P=await google.maps.importLibrary('places');
    log('places loaded; AutocompleteSuggestion='+(!!P.AutocompleteSuggestion)+' SessionToken='+(!!P.AutocompleteSessionToken));
    try{
      const r1=await P.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:'Jupiter Beach Resort', includedRegionCodes:['us']});
      var s1=r1.suggestions||[]; log('T1 minimal OK, suggestions='+s1.length);
      if(s1[0]){var p=s1[0].placePrediction; log('  text.text='+(p.text&&p.text.text)+' | toString='+(p.text&&p.text.toString?p.text.toString():'n/a'));}
    }catch(e){log('T1 ERROR: '+(e&&e.message?e.message:e));}
    try{
      const r2=await P.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:'Jupiter Beach', includedRegionCodes:['us'], locationBias:{north:27.05,south:26.55,east:-79.90,west:-80.40}});
      log('T2 locationBias OK, suggestions='+((r2.suggestions||[]).length));
    }catch(e){log('T2 ERROR: '+(e&&e.message?e.message:e));}
  }catch(e){log('LIB ERROR: '+(e&&e.message?e.message:e));}
}
window.go=go;
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDiVe3XM2xLD2TY-JGQP4tu9RduPyYKFWI&loading=async&callback=go"></script>
</body></html>
